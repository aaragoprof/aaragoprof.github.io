site_name: Aula d'Informàtica
site_description: Material de les assignatures d'informàtica
site_url: https://aaragoprof.github.io/

docs_dir: docs
hooks:
  - hooks/drive.py

theme:
  name: material
  language: ca
  features:
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Mode fosc
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Mode clar

plugins:
  - search
  # Genera el menú automàticament a partir de les carpetes
  - awesome-pages
  # Crea una pàgina per cada carpeta amb PDF (sense que l'hagis d'escriure)
  - gen-files:
      scripts:
        - gen_pages.py

markdown_extensions:
  - attr_list
  - md_in_html
  - def_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - js/home.js
